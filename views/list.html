<!doctype html>
<html><head><title>PLAYHAUZ — Select Theatre</title><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/public/css/app.css"/><link rel="icon" href="/public/assets/brand/playhauz_logo.webp"/></head>
<body class="glitch-bg">
<div class="topbar">

  </div>
  <div class="nav">
